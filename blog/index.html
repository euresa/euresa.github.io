---
layout: default
title: Blog
description: Writing by Sam Eure on software, mathematics, and personal projects.
---

<div class="page-header">
  <h1>Blog</h1>
</div>

<ul class="posts">
  {% for post in site.posts %}
    <li>
      <span class="post-date">{{ post.date | date: "%b %-d, %Y" }}</span>
      <a href="{{ post.url }}" title="{{ post.title }}">{{ post.title }}</a>
    </li>
  {% endfor %}
</ul>
